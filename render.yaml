services:
  - type: web
    name: ring-visitor-recognizer # Render service slug (URL); the public app name is "Visitor Recognizer"
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: PUBLIC_APP_URL
        value: https://ring-visitor-recognizer.onrender.com
      - key: APP_NAME
        value: Visitor Recognizer
      - key: RING_CLIENT_ID
        sync: false
      - key: RING_CLIENT_SECRET
        sync: false
      - key: RING_HMAC_SIGNATURE_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      # Postgres connection string (Render Postgres "Internal Database URL"). Without it the app uses
      # encrypted local files, which Render's free tier deletes on every restart/deploy.
      - key: DATABASE_URL
        sync: false
      - key: RETENTION_DAYS
        value: 30
      - key: SUPPORT_EMAIL
        value: mussadrammeh@protonmail.com
